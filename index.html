<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración de caracteres UTF-8 para caracteres especiales y emojis -->
    <meta charset="UTF-8">
    <!-- Configuración responsive para móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz San Valentín</title>
    <!-- Enlace a la hoja de estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Contenedor principal - Formato 9:16 con fondo de imagen -->
    <div class="container">
        
        <!-- ==========================================
             SECCIÓN 1: PANTALLA DE BIENVENIDA
             - Muestra dedicatoria personal
             - Botón para iniciar el quiz
             ========================================== -->
        <section id="bienvenida" class="seccion active">
            <div class="contenido">
                <!-- Título y dedicatoria en box blanca con efecto de flotación -->
                <div class="titulo-box">
                    <h1>💘 Para Ti 💘</h1>
                    <p class="dedicatoria">Rhi</p>
                </div>
                <!-- Textos descriptivos -->
                <p class="descripcion">Preparé este quiz especial para ti</p>
                <p class="descripcion">¿Qué tanto me conoces?</p>
                <!-- Botón principal para iniciar -->
                <button id="btn-empezar" class="btn-principal">¡Empezar!</button>
            </div>
        </section>

    </div>

    <!-- Enlace al archivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
